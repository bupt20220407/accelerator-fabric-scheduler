apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: acceleratortopologies.scheduling.bupt.dev
spec:
  group: scheduling.bupt.dev
  scope: Cluster
  names:
    plural: acceleratortopologies
    singular: acceleratortopology
    kind: AcceleratorTopology
    shortNames: [atopo]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Source
          type: string
          jsonPath: .spec.source
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [nodeName, observedGeneration, source, devices]
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeName is immutable
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 1
                source:
                  type: string
                  enum: [fixture, nfd, vendor, dra]
                devices:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, vendor, product, resourceName, memoryMiB, health]
                    properties:
                      id:
                        type: string
                        minLength: 1
                      vendor:
                        type: string
                        enum: [nvidia, huawei, amd]
                      product:
                        type: string
                        minLength: 1
                      resourceName:
                        type: string
                        pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/[A-Za-z0-9][-A-Za-z0-9_.]*$
                      numaNode:
                        type: integer
                        format: int32
                        minimum: 0
                      pcieRoot:
                        type: string
                      fabricGroup:
                        type: string
                      memoryMiB:
                        type: integer
                        format: int64
                        minimum: 0
                      health:
                        type: string
                        enum: [Healthy, Unhealthy, Unknown]
                links:
                  type: array
                  items:
                    type: object
                    required: [source, target, type, bandwidthGBps, hops, health]
                    properties:
                      source:
                        type: string
                      target:
                        type: string
                      type:
                        type: string
                        enum: [nvlink, hccs, xgmi, pcie]
                      bandwidthGBps:
                        type: number
                        format: double
                        minimum: 0
                      hops:
                        type: integer
                        format: int32
                        minimum: 0
                      health:
                        type: string
                        enum: [Healthy, Unhealthy, Unknown]
            status:
              type: object
              properties:
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                lastHeartbeatTime:
                  type: string
                  format: date-time
