apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/scheduler-plugins/pull/50
  name: podgroups.scheduling.x-k8s.io
spec:
  group: scheduling.x-k8s.io
  names:
    kind: PodGroup
    listKind: PodGroupList
    plural: podgroups
    shortNames: [pg, pgs]
    singular: podgroup
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: MinMember
          type: integer
          jsonPath: .spec.minMember
        - name: Running
          type: integer
          jsonPath: .status.running
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [minMember]
              properties:
                minMember:
                  type: integer
                  format: int32
                  minimum: 1
                minResources:
                  type: object
                  additionalProperties:
                    anyOf:
                      - type: integer
                      - type: string
                    pattern: '^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$'
                    x-kubernetes-int-or-string: true
                scheduleTimeoutSeconds:
                  type: integer
                  format: int32
                  minimum: 1
            status:
              type: object
              properties:
                phase: {type: string}
                occupiedBy: {type: string}
                running: {type: integer, format: int32}
                succeeded: {type: integer, format: int32}
                failed: {type: integer, format: int32}
                scheduleStartTime: {type: string, format: date-time}
      subresources:
        status: {}
