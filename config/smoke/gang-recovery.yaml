apiVersion: v1
kind: Pod
metadata:
  name: w7-gang-recovery
  namespace: default
  annotations:
    scheduling.bupt.dev/placement-policy: w7-gang-clique
spec:
  schedulerName: accelerator-scheduler
  restartPolicy: Never
  containers:
    - name: worker
      image: accelerator-fabric-scheduler:dev
      imagePullPolicy: IfNotPresent
      command: ["/synthetic-gang-workload"]
      args: ["--member=recovery"]
      resources:
        requests: {nvidia.com/gpu: 4}
        limits: {nvidia.com/gpu: 4}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
