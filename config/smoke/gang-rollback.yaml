apiVersion: scheduling.x-k8s.io/v1alpha1
kind: PodGroup
metadata:
  name: w7-gang-rollback
  namespace: default
spec:
  minMember: 2
  scheduleTimeoutSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: w7-gang-rollback-0
  namespace: default
  labels:
    scheduling.x-k8s.io/pod-group: w7-gang-rollback
  annotations:
    scheduling.bupt.dev/placement-policy: w7-gang-clique
spec:
  schedulerName: accelerator-scheduler
  restartPolicy: Never
  containers:
    - name: worker
      image: accelerator-fabric-scheduler:dev
      imagePullPolicy: IfNotPresent
      command: ["/synthetic-gang-workload"]
      args: ["--member=rollback-0"]
      resources:
        requests: {nvidia.com/gpu: 4}
        limits: {nvidia.com/gpu: 4}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: w7-gang-rollback-1
  namespace: default
  labels:
    scheduling.x-k8s.io/pod-group: w7-gang-rollback
  annotations:
    scheduling.bupt.dev/placement-policy: w7-gang-clique
spec:
  schedulerName: accelerator-scheduler
  restartPolicy: Never
  containers:
    - name: worker
      image: accelerator-fabric-scheduler:dev
      imagePullPolicy: IfNotPresent
      command: ["/synthetic-gang-workload"]
      args: ["--member=rollback-1"]
      resources:
        requests: {nvidia.com/gpu: 5}
        limits: {nvidia.com/gpu: 5}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
