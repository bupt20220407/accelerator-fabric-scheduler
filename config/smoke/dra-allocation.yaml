apiVersion: v1
kind: Pod
metadata:
  name: synthetic-dra-allocation
  namespace: default
spec:
  schedulerName: accelerator-scheduler
  restartPolicy: Never
  resourceClaims:
    - name: accelerators
      resourceClaimTemplateName: synthetic-dra-nvidia
  containers:
    - name: workload
      image: accelerator-fabric-scheduler:dev
      imagePullPolicy: IfNotPresent
      command: ["/synthetic-dra-workload"]
      args: ["--expected=4", "--hold=60s"]
      resources:
        claims:
          - name: accelerators
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
