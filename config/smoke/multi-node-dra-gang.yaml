apiVersion: scheduling.x-k8s.io/v1alpha1
kind: PodGroup
metadata:
  name: w8-multi-node-dra
  namespace: default
spec:
  minMember: 3
  scheduleTimeoutSeconds: 20
---
apiVersion: v1
kind: Pod
metadata:
  name: w8-dra-nvidia
  namespace: default
  labels:
    scheduling.x-k8s.io/pod-group: w8-multi-node-dra
spec:
  schedulerName: accelerator-scheduler
  restartPolicy: Never
  resourceClaims:
    - name: accelerator
      resourceClaimTemplateName: w8-dra-nvidia
  containers:
    - name: worker
      image: accelerator-fabric-scheduler:dev
      imagePullPolicy: IfNotPresent
      command: ["/synthetic-dra-workload"]
      args: ["--expected=1", "--hold=20s"]
      resources:
        claims:
          - name: accelerator
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
---
