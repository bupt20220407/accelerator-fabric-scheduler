apiVersion: v1
kind: ServiceAccount
metadata:
  name: accelerator-topology-controller
  namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accelerator-topology-controller
rules:
  - apiGroups: ["scheduling.bupt.dev"]
    resources: ["acceleratortopologies", "acceleratorplacementpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.bupt.dev"]
    resources: ["acceleratortopologies/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaimtemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-topology-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: accelerator-topology-controller
subjects:
  - kind: ServiceAccount
    name: accelerator-topology-controller
    namespace: accelerator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accelerator-topology-controller
  namespace: accelerator-system
  labels:
    app.kubernetes.io/name: accelerator-topology-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: accelerator-topology-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accelerator-topology-controller
    spec:
      serviceAccountName: accelerator-topology-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: accelerator-fabric-scheduler:dev
          imagePullPolicy: IfNotPresent
          command: ["/topology-controller"]
          args: ["--workers=1"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
