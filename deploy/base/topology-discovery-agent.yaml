apiVersion: v1
kind: ServiceAccount
metadata:
  name: accelerator-topology-discovery
  namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accelerator-topology-discovery
rules:
  - apiGroups: ["scheduling.bupt.dev"]
    resources: ["acceleratortopologies"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-topology-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: accelerator-topology-discovery
subjects:
  - kind: ServiceAccount
    name: accelerator-topology-discovery
    namespace: accelerator-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: accelerator-topology-discovery
  namespace: accelerator-system
  labels:
    app.kubernetes.io/name: accelerator-topology-discovery
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: accelerator-topology-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accelerator-topology-discovery
    spec:
      serviceAccountName: accelerator-topology-discovery
      automountServiceAccountToken: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: scheduling.bupt.dev/fixture
                    operator: Exists
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: discovery
          image: accelerator-fabric-scheduler:dev
          imagePullPolicy: IfNotPresent
          command: ["/topology-discovery-agent"]
          args: ["--node-name=$(NODE_NAME)", "--provider=fixture", "--interval=20s"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
