apiVersion: v1
kind: Namespace
metadata:
  name: accelerator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accelerator-scheduler
  namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-scheduler-as-kube-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: accelerator-scheduler
    namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accelerator-scheduler-as-volume-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: accelerator-scheduler
    namespace: accelerator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accelerator-scheduler-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: accelerator-scheduler
    namespace: accelerator-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accelerator-scheduler-config
  namespace: accelerator-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: accelerator-scheduler
        plugins:
          multiPoint:
            enabled:
              - name: TopologyFit
                weight: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accelerator-scheduler
  namespace: accelerator-system
  labels:
    app.kubernetes.io/name: accelerator-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: accelerator-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accelerator-scheduler
    spec:
      serviceAccountName: accelerator-scheduler
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: accelerator-fabric-scheduler:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/accelerator-scheduler/scheduler-config.yaml
            - --cert-dir=/tmp/certs
            - --v=2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/accelerator-scheduler
              readOnly: true
            - name: certs
              mountPath: /tmp/certs
      volumes:
        - name: config
          configMap:
            name: accelerator-scheduler-config
        - name: certs
          emptyDir: {}
