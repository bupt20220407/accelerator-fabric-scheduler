name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - name: Verify formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Build scheduler
        run: make build
