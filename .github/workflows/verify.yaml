name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify formatting
        run: make fmt-check
      - name: Verify generated code and fixtures
        run: make generate && git diff --exit-code
      - name: Vet
        run: make vet
      - name: Unit tests
        run: make test
      - name: Race tests
        run: make test-race
      - name: Build scheduler
        run: make build
      - name: Verify demo console
        run: make console-verify
